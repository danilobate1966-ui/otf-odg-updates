name: ODG Updates - Discord OTF

on:
  workflow_dispatch:
    inputs:
      enviar_teste:
        description: "Enviar mensagem de TESTE ao Discord (sem anunciar atualizacao)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: odg-updates
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enviar mensagem de teste ao Discord
        if: ${{ inputs.enviar_teste }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          mensagem = (
              "🧪 **TESTE DE NOTIFICAÇÃO — OTF**\n"
              "✅ O sistema ODG Updates conseguiu enviar uma mensagem ao Discord!\n"
              "🔔 **Este é apenas um teste. Nenhuma nova versão foi anunciada.**\n"
              "🔗 https://operatordevgroup.com/downloads"
          )
          dados = json.dumps({"content": mensagem}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=dados,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/danilobate1966-ui/otf-odg-updates, 1.1)",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resposta:
              print("Teste enviado. HTTP:", resposta.status)
          PY

      - name: Verificar versao atual do ODG
        if: ${{ !inputs.enviar_teste }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class ExtratorTexto(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ignorar = 0
                  self.partes = []

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "noscript"):
                      self.ignorar += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style", "noscript") and self.ignorar:
                      self.ignorar -= 1

              def handle_data(self, data):
                  if not self.ignorar:
                      self.partes.append(data)

          pagina = "https://operatordevgroup.com/"
          download = "https://operatordevgroup.com/downloads"
          estado = Path(".odg-version")
          requisicao = urllib.request.Request(
              pagina,
              headers={"User-Agent": "Mozilla/5.0", "Accept": "text/html"},
          )
          with urllib.request.urlopen(requisicao, timeout=30) as resposta:
              html = resposta.read().decode("utf-8", errors="replace")

          extrator = ExtratorTexto()
          extrator.feed(html)
          texto = " ".join(extrator.partes)

          # Nao buscar a primeira versao: ha referencias historicas no site.
          encontrado = re.search(
              r"\bcurrent\s+pack\s+is\s+(v\d+\.\d+\.\d+)\b",
              texto,
              flags=re.IGNORECASE,
          )
          if not encontrado:
              raise RuntimeError("Versao atual nao encontrada na pagina inicial do ODG.")

          atual = encontrado.group(1).lower()
          anterior = estado.read_text().strip().lower() if estado.exists() else None
          print("Versao atual:", atual)
          print("Versao registrada:", anterior or "nenhuma")

          # Corrige o estado criado pelo monitor antigo, que registrou v2.2.3.
          if anterior is None or anterior == "v2.2.3":
              estado.write_text(atual + "\n")
              print("Referencia inicial corrigida sem enviar aviso.")
          elif atual == anterior:
              print("Nenhuma atualizacao nova.")
          else:
              def numero(v):
                  return tuple(int(parte) for parte in v.lstrip("v").split("."))

              if numero(atual) <= numero(anterior):
                  print("Versao menor ou igual: possivel cache antigo. Sem aviso.")
              else:
                  mensagem = (
                      "⚔️ **NOVA ATUALIZAÇÃO ODG OPERATIONS!**\n"
                      f"📦 Versão: **{atual}** (anterior: {anterior})\n"
                      "🎮 Operadores OTF, atualizem o pacote antes das operações.\n"
                      f"🔗 Download oficial: {download}"
                  )
                  dados = json.dumps({"content": mensagem}).encode("utf-8")
                  req = urllib.request.Request(
                      os.environ["DISCORD_WEBHOOK_URL"],
                      data=dados,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "DiscordBot (https://github.com/danilobate1966-ui/otf-odg-updates, 1.1)",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=30) as resposta:
                      print("Aviso enviado ao Discord. HTTP:", resposta.status)
                  estado.write_text(atual + "\n")
          PY

      - name: Salvar versao monitorada
        if: ${{ !inputs.enviar_teste }}
        run: |
          if [ -n "$(git status --porcelain -- .odg-version)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .odg-version
            git commit -m "Atualizar versao ODG monitorada"
            git push
          fi
