name: ODG Updates - Discord OTF

on:
  workflow_dispatch:
    inputs:
      enviar_teste:
        description: "Enviar uma mensagem de teste ao Discord"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: odg-updates
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ODG e notificar Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ENVIAR_TESTE: ${{ inputs.enviar_teste || 'false' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          URL = "https://archduke-interactive.com/downloads"
          ESTADO = Path(".odg-version")
          WEBHOOK = os.environ.get("DISCORD_WEBHOOK_URL", "")

          def avisar(mensagem):
              if not WEBHOOK:
                  raise RuntimeError("Secret DISCORD_WEBHOOK_URL nao configurado.")
              payload = json.dumps({"content": mensagem}).encode("utf-8")
              pedido = urllib.request.Request(
                  WEBHOOK,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "DiscordBot (https://github.com/danilobate1966-ui/otf-odg-updates, 1.2)",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(pedido, timeout=30) as resposta:
                  print("Mensagem enviada ao Discord. HTTP:", resposta.status)

          if os.environ.get("ENVIAR_TESTE", "false").lower() == "true":
              avisar(
                  "🧪 **TESTE OTF — ARCHDUKE / ODG**\n"
                  "✅ Conexao com o Discord funcionando.\n"
                  "🔔 Esta mensagem nao representa uma nova atualizacao.\n"
                  f"🔗 {URL}"
              )
          else:
              class TextoHTML(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.ignorar = 0
                      self.partes = []

                  def handle_starttag(self, tag, attrs):
                      if tag in ("script", "style", "noscript"):
                          self.ignorar += 1

                  def handle_endtag(self, tag):
                      if tag in ("script", "style", "noscript") and self.ignorar:
                          self.ignorar -= 1

                  def handle_data(self, data):
                      if not self.ignorar:
                          self.partes.append(data)

              pedido = urllib.request.Request(
                  URL,
                  headers={"User-Agent": "Mozilla/5.0", "Accept": "text/html"},
              )
              with urllib.request.urlopen(pedido, timeout=30) as resposta:
                  html = resposta.read().decode("utf-8", errors="replace")

              parser = TextoHTML()
              parser.feed(html)
              texto = " ".join(parser.partes)
              achado = re.search(
                  r"\bPack\s+v(\d+\.\d+(?:\.\d+)?)\b", texto, re.IGNORECASE
              )
              if not achado:
                  raise RuntimeError("Versao 'Pack vX.Y.Z' nao encontrada no site.")

              atual = "v" + achado.group(1)
              anterior = ESTADO.read_text().strip() if ESTADO.exists() else None
              print("Versao encontrada:", atual)
              print("Versao registrada:", anterior or "nenhuma")

              def numero(versao):
                  return tuple(map(int, versao.lstrip("vV").split(".")))

              if anterior is None:
                  ESTADO.write_text(atual + "\n")
                  print("Primeira verificacao: referencia salva, sem anuncio.")
              elif atual == anterior:
                  print("Sem atualizacoes novas.")
              elif numero(atual) > numero(anterior):
                  avisar(
                      "⚔️ **NOVA ATUALIZAÇÃO DO ODG OPERATIONS!**\n"
                      f"📦 Nova versão: **{atual}** (anterior: {anterior})\n"
                      "🎮 Operadores da OTF, confiram o novo pacote!\n"
                      f"🔗 Download oficial: {URL}"
                  )
                  ESTADO.write_text(atual + "\n")
                  print("Atualizacao registrada.")
              else:
                  print("Site mostra versao mais antiga; sem aviso ou alteracao.")
          PY

      - name: Salvar versao monitorada
        if: ${{ !inputs.enviar_teste }}
        run: |
          if [ -n "$(git status --porcelain -- .odg-version)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .odg-version
            git commit -m "Atualizar versao ODG monitorada"
            git push
          fi
